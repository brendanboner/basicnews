# Nginx snippet for BasicWeb: deny web access to sensitive/internal paths.
#
# IMPORTANT: Nginx does NOT auto-load config from the website directory.
# Copy/paste or include this inside the correct `server { ... }` block for your
# site (Synology: Web Station / Portal / reverse proxy / DSM nginx config),
# then test and reload nginx:
#   sudo nginx -t && sudo nginx -s reload   (paths/commands vary on Synology)
#
# These rules assume the app is served from the /news/ subdirectory of the
# site (e.g. https://example.com/news/). If you serve it from a different
# subpath or the site root, adjust the /news/ prefixes accordingly.

# Never expose git metadata
location ^~ /news/.git {
    deny all;
    return 404;
}

# CLI/admin tools - shell/command line only
location ^~ /news/bin/ {
    deny all;
    return 404;
}

# Internal app code/data directories (defense-in-depth)
location ^~ /news/config/ {
    deny all;
    return 404;
}

location ^~ /news/includes/ {
    deny all;
    return 404;
}

location ^~ /news/users/ {
    deny all;
    return 404;
}

# Internal derived/workflow files in content
location ~* ^/news/content/_ {
    deny all;
    return 404;
}

# Optional: block hidden files generally (be careful if you use .well-known)
# location ~ /\.(?!well-known) {
#     deny all;
#     return 404;
# }

# Optional (Apache-style files not used by Nginx, but avoid serving them)
location ~* /(\.htaccess|\.user\.ini)$ {
    deny all;
    return 404;
}
